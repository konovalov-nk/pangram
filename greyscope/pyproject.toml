[project]
name = "pangram-greyscope-sidecar"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.2,<2",
    "emoji>=2.15,<3",
    "fastapi>=0.116,<1",
    "huggingface-hub>=0.27,<2",
    "torch==2.11.0",
    "torchao>=0.15,<1",
    "transformers==5.5.0",
    "uvicorn[standard]>=0.35,<1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
