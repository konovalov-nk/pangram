[project]
name = "local-ai-detector"
version = "0.1.0"
description = "Local English/Russian AI text detector for NVIDIA GPUs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.2,<2",
    "bitsandbytes>=0.45,<1",
    "dacite>=1.9,<2",
    "emoji>=2.10,<3",
    "fastapi>=0.116,<1",
    "loguru>=0.7,<1",
    "omegaconf>=2.3,<3",
    "peft>=0.18,<1",
    "protobuf>=5,<7",
    "safetensors>=0.5,<1",
    "scipy>=1.15,<2",
    "sentencepiece>=0.2,<1",
    "torch==2.11.0",
    "transformers==4.55.0",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
ai-detector = "ai_detector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
